<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buster League — Season Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #c41e3a 0%, #d94e59 100%); color: white; padding: 24px 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header-left h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2em; letter-spacing: 2px; }
        .header-left p { opacity: 0.85; font-size: 0.9em; margin-top: 2px; }
        .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.9em; cursor: pointer; border: none; text-decoration: none; display: inline-block; transition: all 0.2s; }
        .btn-ghost { background: rgba(255,255,255,0.2); color: white; }
        .btn-ghost:hover { background: rgba(255,255,255,0.3); transform: translateY(-1px); }
        .loading-bar { background: white; border-radius: 12px; padding: 12px 20px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; }
        .loading-indicator { display: none; font-size: 0.85em; color: #c41e3a; font-weight: 700; align-items: center; gap: 6px; }
        .loading-indicator.show { display: flex; }
        .spinner { width: 14px; height: 14px; border: 2px solid #f0f0f0; border-top-color: #c41e3a; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .nav-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
        .nav-tab { padding: 9px 18px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); color: white; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.85em; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .nav-tab:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.5); }
        .nav-tab.active { background: white; color: #1e3c72; border-color: white; }
        .team-nav { background: white; border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: none; flex-wrap: wrap; gap: 6px; align-items: center; }
        .team-nav.show { display: flex; }
        .team-nav-label { font-size: 0.75em; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #6c757d; margin-right: 4px; }
        .team-chip { padding: 5px 12px; border-radius: 20px; border: 2px solid #dee2e6; background: white; font-size: 0.8em; font-weight: 700; cursor: pointer; color: #495057; transition: all 0.12s; }
        .team-chip:hover { border-color: #1e3c72; color: #1e3c72; }
        .team-chip.active { background: #1e3c72; color: white; border-color: #1e3c72; }
        .card { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); margin-bottom: 20px; }
        .card-title { font-size: 0.82em; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #1e3c72; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #c41e3a; display: flex; justify-content: space-between; align-items: center; }
        .card-title span { font-size: 1.1em; font-weight: 500; color: #6c757d; letter-spacing: 0; text-transform: none; }
        .dmb-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #dee2e6; }
        .dmb-table { width: 100%; border-collapse: collapse; font-size: 0.87em; }
        .dmb-table thead { background: #1e3c72; color: white; position: sticky; top: 0; z-index: 5; }
        .dmb-table th { padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; font-size: 0.85em; letter-spacing: 0.5px; }
        .dmb-table td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
        .dmb-table tbody tr:hover { background: #f8f9fa; }
        .dmb-table tbody tr:nth-child(even) { background: #fafafa; }
        .dmb-table tbody tr:nth-child(even):hover { background: #f0f0f0; }
        .badge-w { color: #155724; background: #d1e7dd; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.82em; }
        .badge-l { color: #842029; background: #f8d7da; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.82em; }
        .badge-t { color: #664d03; background: #fff3cd; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.82em; }
        .pct-high { color: #155724; font-weight: 700; }
        .pct-mid  { color: #664d03; font-weight: 600; }
        .pct-low  { color: #842029; font-weight: 600; }
        .leaders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .leader-block { background: #f8f9fa; border-radius: 8px; overflow: hidden; border: 1px solid #e9ecef; }
        .leader-block-title { background: #1e3c72; color: white; padding: 8px 14px; font-size: 0.78em; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .leader-row { display: flex; align-items: center; padding: 7px 14px; border-bottom: 1px solid #f0f0f0; gap: 10px; }
        .leader-row:last-child { border-bottom: none; }
        .leader-rank { font-size: 0.72em; font-weight: 800; color: #adb5bd; width: 18px; flex-shrink: 0; }
        .leader-rank.gold   { color: #c9a227; }
        .leader-rank.silver { color: #9e9e9e; }
        .leader-rank.bronze { color: #b87333; }
        .leader-name { font-weight: 700; flex: 1; font-size: 0.88em; }
        .leader-team { font-size: 0.75em; color: #6c757d; background: #e9ecef; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
        .leader-val { font-weight: 800; color: #c41e3a; font-size: 0.9em; min-width: 50px; text-align: right; }
        .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
        .empty-state .icon { font-size: 3em; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.1em; margin-bottom: 6px; color: #495057; }
        .error-state { background: #fff5f5; border: 1px solid #f8d7da; border-radius: 8px; padding: 20px; color: #842029; font-weight: 600; margin: 20px 0; }
        @media (max-width: 768px) { .header { flex-direction: column; gap: 12px; } .nav-tab { font-size: 0.78em; padding: 7px 12px; } }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="header-left">
            <h1>⚾ Buster League Results</h1>
            <p id="header-sub">Diamond Mind Baseball — Current Week</p>
        </div>
        <div class="header-right">
            <a href="myteam.html" class="btn btn-ghost">My Team →</a>
        </div>
    </div>

    <div class="loading-bar">
        <div class="loading-indicator" id="loading">
            <div class="spinner"></div> Loading…
        </div>
        <span id="load-status" style="font-size:0.85em;color:#6c757d;font-weight:600;"></span>
    </div>

    <div class="nav-tabs" id="nav-tabs" style="display:none;">
        <button class="nav-tab active" onclick="showSection('standings')">📊 Standings</button>
        <button class="nav-tab" onclick="showSection('results')">🎯 Game Results</button>
        <button class="nav-tab" onclick="showSection('bat-leaders')">🏏 Batting Leaders</button>
        <button class="nav-tab" onclick="showSection('pch-leaders')">⚾ Pitching Leaders</button>
        <button class="nav-tab" onclick="showSection('fld-leaders')">🧤 Fielding Leaders</button>
        <button class="nav-tab" onclick="showSection('team-bat')">📋 Team Batting</button>
        <button class="nav-tab" onclick="showSection('team-pch')">📋 Team Pitching</button>
        <button class="nav-tab" onclick="showSection('team-fld')">📋 Team Fielding</button>
        <button class="nav-tab" onclick="showSection('injuries')">🤕 Injuries</button>
        <button class="nav-tab" onclick="showSection('transactions')">🔄 Transactions</button>
        <button class="nav-tab" onclick="showSection('teams')">🏟 Teams</button>
    </div>

    <div class="team-nav" id="team-nav"></div>

    <div id="content-area">
        <div class="empty-state">
            <div class="icon">⚾</div>
            <h3>Loading current week data…</h3>
            <p>Reading from dmb/current/</p>
        </div>
    </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG — update these paths if your folder structure changes
// ═══════════════════════════════════════════════════════════════
const DMB_CURRENT = 'dmb/current';
const DMB_GAMES   = 'dmb/games';

// ═══════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════
let currentSection = 'standings';
let fileCache      = {};
let teamList       = [];

// ═══════════════════════════════════════════════════════════════
// Init — load on page open
// ═══════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => loadCurrent());

async function loadCurrent() {
    setLoading(true);
    setStatus('');

    const indexText = await fetchFile('index.htm');
    if (!indexText) {
        setLoading(false);
        showError(`Could not load data from ${DMB_CURRENT}/. Make sure your DMB files are uploaded to dmb/current/.`);
        return;
    }

    await buildTeamList();
    document.getElementById('nav-tabs').style.display = 'flex';
    setLoading(false);
    setStatus('Current week loaded');
    showSection('standings');
}

// ═══════════════════════════════════════════════════════════════
// File fetching — org files from dmb/current/, game files from dmb/games/
// ═══════════════════════════════════════════════════════════════
function isGameFile(filename) {
    return /^\d{13}\.htm$/i.test(filename);
}

async function fetchFile(filename) {
    const url = isGameFile(filename) ? `${DMB_GAMES}/${filename}` : `${DMB_CURRENT}/${filename}`;
    if (fileCache[url]) return fileCache[url];
    try {
        const res = await fetch(url);
        if (!res.ok) return null;
        const text = await res.text();
        fileCache[url] = text;
        return text;
    } catch(e) { return null; }
}

function parseHTML(text) {
    return new DOMParser().parseFromString(text, 'text/html');
}

async function buildTeamList() {
    teamList = [];
    for (const lgFile of ['lgindex1.htm', 'lgindex2.htm']) {
        const text = await fetchFile(lgFile);
        if (!text) continue;
        const doc = parseHTML(text);
        doc.querySelectorAll('a[href*="tmindex"]').forEach(a => {
            const href = a.getAttribute('href');
            const name = a.textContent.trim();
            if (href && name) teamList.push({ href, name });
        });
    }
}

// ═══════════════════════════════════════════════════════════════
// Section navigation
// ═══════════════════════════════════════════════════════════════
function showSection(section) {
    currentSection = section;

    document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.remove('active');
        if (t.getAttribute('onclick') && t.getAttribute('onclick').includes(`'${section}'`)) t.classList.add('active');
    });

    const teamNav = document.getElementById('team-nav');
    if (section === 'teams') {
        buildTeamNav();
        teamNav.classList.add('show');
    } else {
        teamNav.classList.remove('show');
    }

    const fileMap = {
        'standings':    'orgstand.htm',
        'results':      'orggr.htm',
        'bat-leaders':  'orgbatldrs.htm',
        'pch-leaders':  'orgpchldrs.htm',
        'fld-leaders':  'orgfldldrs.htm',
        'team-bat':     'orgtmbattot.htm',
        'team-pch':     'orgtmpchtot.htm',
        'team-fld':     'orgtmfldtot.htm',
        'injuries':     'orgcurrinj.htm',
        'transactions': 'orgtxnlog.htm',
    };

    if (section === 'teams') { renderTeamList(); return; }

    const file = fileMap[section];
    if (!file) return;

    setLoading(true);
    fetchFile(file).then(text => {
        setLoading(false);
        if (!text) { showError(`Could not load ${file} from dmb/current/.`); return; }
        renderSection(section, text);
    });
}

// ═══════════════════════════════════════════════════════════════
// Team navigation
// ═══════════════════════════════════════════════════════════════
function buildTeamNav() {
    const nav = document.getElementById('team-nav');
    nav.innerHTML = '<span class="team-nav-label">Team:</span>';
    teamList.forEach((t, i) => {
        const btn = document.createElement('button');
        btn.className = 'team-chip' + (i === 0 ? ' active' : '');
        btn.textContent = t.name;
        btn.dataset.href = t.href;
        btn.addEventListener('click', function() {
            document.querySelectorAll('.team-chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            loadTeamPage(this.dataset.href);
        });
        nav.appendChild(btn);
    });
    if (teamList.length) loadTeamPage(teamList[0].href);
}

async function loadTeamPage(tmIndexFile) {
    setLoading(true);
    const text = await fetchFile(tmIndexFile);
    setLoading(false);
    if (!text) { showError('Could not load team page.'); return; }

    const doc = parseHTML(text);
    const h2 = doc.querySelector('h2');
    const teamName = h2 ? h2.textContent.trim() : 'Team';
    const pages = [];
    doc.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        const label = a.textContent.trim();
        if (href && href.startsWith('tm') && !href.startsWith('tmindex') && label) pages.push({ href, label });
    });
    renderTeamHub(teamName, pages);
}

function renderTeamHub(teamName, pages) {
    document.getElementById('content-area').innerHTML = `
        <div class="card">
            <div class="card-title">${escHtml(teamName)}</div>
            <div id="team-page-btns" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px;"></div>
        </div>
        <div id="team-sub-content"></div>`;

    const btnContainer = document.getElementById('team-page-btns');
    pages.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.textContent = p.label;
        btn.dataset.href = p.href;
        btn.style.cssText = 'padding:12px 16px;background:#f8f9fa;border:2px solid #dee2e6;border-radius:8px;font-family:inherit;font-weight:700;font-size:0.88em;cursor:pointer;text-align:left;color:#1e3c72;transition:all 0.15s;';
        btn.addEventListener('mouseover', function() { this.style.borderColor='#c41e3a'; this.style.background='#fff5f7'; });
        btn.addEventListener('mouseout',  function() { this.style.borderColor='#dee2e6'; this.style.background='#f8f9fa'; });
        btn.addEventListener('click', function() { loadTeamSubPage(this.dataset.href, teamName); });
        btnContainer.appendChild(btn);
    });
    if (pages.length) loadTeamSubPage(pages[0].href, teamName);
}

async function loadTeamSubPage(filename, teamName) {
    setLoading(true);
    const text = await fetchFile(filename);
    setLoading(false);
    if (!text) { const sub = document.getElementById('team-sub-content'); if (sub) sub.innerHTML = '<div class="error-state">Could not load file.</div>'; return; }
    renderTeamSubPage(filename, teamName, text);
}

// ═══════════════════════════════════════════════════════════════
// Section renderers
// ═══════════════════════════════════════════════════════════════
function renderSection(section, text) {
    const doc = parseHTML(text);
    switch(section) {
        case 'standings':    renderStandings(doc);    break;
        case 'results':      renderGameResults(doc);  break;
        case 'bat-leaders':  renderLeaders(doc, 'Batting Leaders'); break;
        case 'pch-leaders':  renderLeaders(doc, 'Pitching Leaders'); break;
        case 'fld-leaders':  renderLeaders(doc, 'Fielding Leaders'); break;
        case 'team-bat':     renderGenericTable(doc, 'Team Batting Totals'); break;
        case 'team-pch':     renderGenericTable(doc, 'Team Pitching Totals'); break;
        case 'team-fld':     renderGenericTable(doc, 'Team Fielding Totals'); break;
        case 'injuries':     renderGenericTable(doc, 'Current Injuries'); break;
        case 'transactions': renderGenericTable(doc, 'Transaction Log'); break;
        default:             renderGenericTable(doc, section); break;
    }
}

function renderStandings(doc) {
    const tables = doc.querySelectorAll('table');
    let html = `<div class="card"><div class="card-title">Standings <span>Current Week</span></div>`;

    tables.forEach(table => {
        const titleRow = table.querySelector('tr.dmrptsecttitle');
        const sectionName = titleRow ? titleRow.textContent.trim() : '';
        if (!sectionName) return;

        html += `<h3 style="font-size:0.85em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#1e3c72;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #e9ecef;">${escHtml(sectionName)}</h3>`;
        html += `<div class="dmb-wrap"><table class="dmb-table">`;

        let headerDone = false;
        table.querySelectorAll('tr').forEach(row => {
            if (row.classList.contains('dmrptsecttitle')) return;
            const cells = row.querySelectorAll('td');
            if (!cells.length) return;
            const isBlank = Array.from(cells).every(td => !td.textContent.trim() || td.textContent.trim() === '\u00a0');
            if (isBlank) return;

            if (row.classList.contains('dmrptsecthdr')) {
                if (!headerDone) {
                    html += '<thead><tr>';
                    cells.forEach(td => html += `<th>${escHtml(td.textContent.trim())}</th>`);
                    html += '</tr></thead><tbody>';
                    headerDone = true;
                }
                return;
            }

            const firstText = cells[0] ? cells[0].textContent.trim() : '';
            const isDivHeader = ['East','West','North','South','Central','American','National'].includes(firstText);
            if (isDivHeader) {
                html += `<tr><td colspan="${cells.length}" style="padding:6px 12px;background:#f0f4fb;font-weight:800;color:#1e3c72;font-size:0.82em;letter-spacing:1px;text-transform:uppercase;">${escHtml(firstText)}</td></tr>`;
                return;
            }

            html += '<tr>';
            cells.forEach((td, ci) => {
                let val = td.textContent.trim().replace(/\u00a0/g, '');
                if (!val) { html += '<td></td>'; return; }
                if (ci === 4 && val.startsWith('.')) {
                    const pct = parseFloat(val);
                    const cls = pct >= 0.550 ? 'pct-high' : pct <= 0.450 ? 'pct-low' : 'pct-mid';
                    html += `<td><span class="${cls}">${escHtml(val)}</span></td>`;
                } else if (ci === 9 && /^[wlWL]+$/.test(val)) {
                    const colored = val.split('').map(c => c.toLowerCase() === 'w'
                        ? `<span style="color:#155724;font-weight:700;">W</span>`
                        : `<span style="color:#842029;">L</span>`).join('');
                    html += `<td style="font-family:monospace;font-size:0.85em;letter-spacing:1px;">${colored}</td>`;
                } else {
                    html += `<td>${escHtml(val)}</td>`;
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table></div>';
    });

    html += '</div>';
    document.getElementById('content-area').innerHTML = html;
}

function renderGameResults(doc) {
    const table = doc.querySelector('table');
    if (!table) { showError('No game results found.'); return; }

    let html = `<div class="card">
        <div class="card-title">Game Results <span>Current Week</span></div>
        <p style="font-size:0.82em;color:#6c757d;margin-bottom:12px;">Click a date to view the full box score.</p>
        <div class="dmb-wrap"><table class="dmb-table">`;

    let inBody = false;
    table.querySelectorAll('tr').forEach(row => {
        if (row.classList.contains('dmrptsecttitle')) return;
        if (row.classList.contains('dmrptsecthdr')) {
            html += '<thead><tr>';
            row.querySelectorAll('td').forEach(td => html += `<th>${escHtml(td.textContent.trim())}</th>`);
            html += '</tr></thead><tbody>';
            inBody = true;
            return;
        }
        if (!inBody) return;
        const cells = row.querySelectorAll('td');
        if (!cells.length) return;
        const isBlank = Array.from(cells).every(td => !td.textContent.trim() || td.textContent.trim() === '\u00a0');
        if (isBlank) return;

        html += '<tr>';
        cells.forEach((td, ci) => {
            const val = td.textContent.trim().replace(/\u00a0/g, '');
            const link = td.querySelector('a');
            if (ci === 0 && link) {
                const gameFile = link.getAttribute('href');
                html += `<td><button onclick="openBoxScore('${escHtml(gameFile)}')"
                    style="background:none;border:none;color:#1e3c72;font-weight:700;font-size:inherit;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit;"
                    >${escHtml(val)}</button></td>`;
            } else if (ci === 4) {
                const cls = val === 'W' ? 'badge-w' : val === 'L' ? 'badge-l' : 'badge-t';
                html += `<td><span class="${cls}">${escHtml(val || '—')}</span></td>`;
            } else {
                html += `<td>${escHtml(val || '')}</td>`;
            }
        });
        html += '</tr>';
    });

    html += '</tbody></table></div></div>';
    document.getElementById('content-area').innerHTML = html;
}

async function openBoxScore(gameFile) {
    window.open(`${DMB_GAMES}/${gameFile}`, '_blank');
}

function renderLeaders(doc, title) {
    const groups = [];
    doc.querySelectorAll('table').forEach(table => {
        if (!table.querySelectorAll('td[colspan="3"]').length) return;
        Array.from(table.querySelectorAll('tr')).forEach(row => {
            const hdr = row.querySelector('td[colspan="3"]');
            if (hdr && hdr.textContent.trim()) {
                row.querySelectorAll('td[colspan="3"]').forEach(h => {
                    if (h.textContent.trim()) groups.push({ name: h.textContent.trim(), rows: [] });
                });
            } else {
                const tds = row.querySelectorAll('td');
                if (!tds.length || !groups.length) return;
                const activeGroups = groups.slice(-3);
                const colSize = Math.ceil(tds.length / activeGroups.length);
                activeGroups.forEach((grp, gi) => {
                    const base = gi * colSize;
                    const name = tds[base]?.textContent.trim().replace(/\u00a0/g,'');
                    const team = tds[base+1]?.textContent.trim().replace(/\u00a0/g,'');
                    const val  = tds[base+2]?.textContent.trim().replace(/\u00a0/g,'');
                    if (name && team && val) grp.rows.push({ name, team, val });
                });
            }
        });
    });

    if (!groups.length) { renderGenericTable(doc, title); return; }

    let html = `<div class="card"><div class="card-title">${escHtml(title)} <span>Current Week</span></div><div class="leaders-grid">`;
    groups.forEach(grp => {
        if (!grp.rows.length) return;
        html += `<div class="leader-block"><div class="leader-block-title">${escHtml(grp.name)}</div>`;
        grp.rows.slice(0, 10).forEach((r, i) => {
            const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
            html += `<div class="leader-row">
                <span class="leader-rank ${rankClass}">${i+1}</span>
                <span class="leader-name">${escHtml(r.name)}</span>
                <span class="leader-team">${escHtml(r.team)}</span>
                <span class="leader-val">${escHtml(r.val)}</span>
            </div>`;
        });
        html += '</div>';
    });
    html += '</div></div>';
    document.getElementById('content-area').innerHTML = html;
}

function renderGenericTable(doc, title) {
    const tables = doc.querySelectorAll('table');
    if (!tables.length) { showError('No data found.'); return; }

    let html = `<div class="card"><div class="card-title">${escHtml(title)} <span>Current Week</span></div>`;
    tables.forEach(table => {
        const titleRow = table.querySelector('tr.dmrptsecttitle');
        const subTitle = titleRow ? titleRow.textContent.trim() : '';
        if (subTitle) html += `<h3 style="font-size:0.82em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#1e3c72;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid #e9ecef;">${escHtml(subTitle)}</h3>`;

        html += `<div class="dmb-wrap" style="margin-bottom:16px;"><table class="dmb-table">`;
        let headerDone = false;
        table.querySelectorAll('tr').forEach(row => {
            if (row.classList.contains('dmrptsecttitle')) return;
            const cells = row.querySelectorAll('td');
            if (!cells.length) return;
            const isBlank = Array.from(cells).every(td => !td.textContent.trim() || td.textContent.trim() === '\u00a0');
            if (isBlank) return;

            if (row.classList.contains('dmrptsecthdr')) {
                if (!headerDone) { html += '<thead><tr>'; cells.forEach(td => html += `<th>${escHtml(td.textContent.trim())}</th>`); html += '</tr></thead><tbody>'; headerDone = true; }
                return;
            }
            if (!headerDone) { html += '<tbody>'; headerDone = true; }
            html += '<tr>';
            cells.forEach(td => html += `<td>${escHtml(td.textContent.trim().replace(/\u00a0/g,''))}</td>`);
            html += '</tr>';
        });
        html += '</tbody></table></div>';
    });
    html += '</div>';
    document.getElementById('content-area').innerHTML = html;
}

function renderTeamSubPage(filename, teamName, text) {
    const doc = parseHTML(text);
    const h3 = doc.querySelector('h3');
    const subTitle = h3 ? h3.textContent.trim() : filename;

    doc.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (href && href.match(/^\d+\.htm$/)) {
            a.setAttribute('href', `${DMB_GAMES}/${href}`);
            a.setAttribute('target', '_blank');
        }
    });

    const tables = doc.querySelectorAll('table');
    let html = `<div class="card" style="margin-top:0;"><div class="card-title">${escHtml(subTitle)}</div>`;

    tables.forEach(table => {
        const titleRow = table.querySelector('tr.dmrptsecttitle');
        const secTitle = titleRow ? titleRow.textContent.trim() : '';
        if (secTitle) html += `<h3 style="font-size:0.82em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#1e3c72;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid #e9ecef;">${escHtml(secTitle)}</h3>`;

        html += `<div class="dmb-wrap" style="margin-bottom:16px;"><table class="dmb-table">`;
        let headerOpen = false, headerRows = [];

        table.querySelectorAll('tr').forEach(row => {
            if (row.classList.contains('dmrptsecttitle')) return;
            const cells = row.querySelectorAll('td');
            if (!cells.length) return;
            const isBlank = Array.from(cells).every(td => !td.textContent.trim() || td.textContent.trim() === '\u00a0');
            if (isBlank && !row.classList.contains('dmrptsecthdr')) return;

            if (row.classList.contains('dmrptsecthdr')) {
                if (headerOpen !== 'collecting') { headerOpen = 'collecting'; headerRows = []; }
                headerRows.push(row);
                return;
            }

            if (headerOpen === 'collecting') {
                html += '<thead>';
                headerRows.forEach(hr => {
                    const isGroupRow = Array.from(hr.querySelectorAll('td')).some(td => parseInt(td.getAttribute('colspan')||'1') > 1);
                    html += '<tr>';
                    hr.querySelectorAll('td').forEach(td => {
                        const colspan = parseInt(td.getAttribute('colspan') || '1');
                        const val = td.textContent.trim().replace(/\u00a0/g, '');
                        const cs = colspan > 1 ? ` colspan="${colspan}"` : '';
                        const align = isGroupRow ? 'center' : (td.getAttribute('align') || 'left');
                        const border = isGroupRow && val ? ' border-bottom:2px solid rgba(255,255,255,0.4);' : '';
                        html += `<th${cs} style="text-align:${align};${border}">${escHtml(val)}</th>`;
                    });
                    html += '</tr>';
                });
                html += '</thead><tbody>';
                headerOpen = true;
            }

            html += '<tr>';
            cells.forEach(td => {
                const link = td.querySelector('a[target="_blank"]');
                if (link) {
                    html += `<td><a href="${escHtml(link.getAttribute('href'))}" target="_blank" style="color:#1e3c72;font-weight:700;text-decoration:underline;">${escHtml(td.textContent.trim())}</a></td>`;
                } else {
                    html += `<td>${escHtml(td.textContent.trim().replace(/\u00a0/g,''))}</td>`;
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table></div>';
    });

    html += '</div>';
    const sub = document.getElementById('team-sub-content');
    if (sub) sub.innerHTML = html;
}

function renderTeamList() {
    document.getElementById('content-area').innerHTML =
        `<div id="team-sub-content"><div class="empty-state"><div class="icon">🏟</div><h3>Select a team above</h3></div></div>`;
}

// ═══════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════
function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setLoading(show) { document.getElementById('loading').classList.toggle('show', show); }
function setStatus(msg)   { document.getElementById('load-status').textContent = msg; }
function showError(msg)   { document.getElementById('content-area').innerHTML = `<div class="error-state">⚠️ ${escHtml(msg)}</div>`; }
</script>
